server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: inventory-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:sagalab}
    password: ${DB_PASSWORD:sagalab}
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
